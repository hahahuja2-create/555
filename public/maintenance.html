<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="robots" content="noindex" />
    <title>Portgainy | Scheduled maintenance</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="/fonts/arcade/big-shoulders.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/maintenance.css?v=2" />
    <script src="/maintenance.js?v=2" defer></script>
  </head>
  <body>
    <div class="maintenance-shell">
      <header class="maintenance-header">
        <div class="brand" aria-label="Portgainy"><img src="/favicon.svg" alt="" width="40" height="40" /><span class="wordmark">Portgainy</span></div>
      </header>
      <main>
        <section class="maintenance-card" aria-labelledby="maintenance-title">
          <img class="cube" src="/favicon.svg" alt="" width="132" height="132" />
          <div class="status-label"><span aria-hidden="true"></span><span>Scheduled maintenance</span></div>
          <h1 id="maintenance-title">Level up in progress</h1>
          <p class="description">Portgainy is temporarily unavailable while we carry out scheduled maintenance to upgrade our services. Your balances and account data are safe.</p>
          <div class="resume-card">
            <div><p>We’re back</p><time datetime="2026-10-31T14:00:00Z">31 October at 18:00</time><small>Tbilisi time (GMT+4)</small></div>
          </div>
          <p class="thanks">Thank you for your patience.</p>
        </section>
      </main>
      <footer>© 2026 Portgainy</footer>
    </div>
  </body>
</html>
