<!doctype html>
<html lang="ka">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#14161b" />
    <meta name="robots" content="noindex" />
    <title>TaskMall | ტექნიკური სამუშაოები</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/georgian.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/maintenance.css?v=1" />
    <script src="/maintenance.js?v=1" defer></script>
  </head>
  <body>
    <div class="maintenance-shell">
      <header class="maintenance-header">
        <div class="brand" aria-label="TaskMall"><img src="/favicon.svg" alt="" width="38" height="38" /><span>TaskMall</span></div>
        <div class="language-control">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c5 5 5 13 0 18-5-5-5-13 0-18Z"/></svg>
          <label class="visually-hidden" for="maintenance-language" data-copy="language">ენა</label>
          <select id="maintenance-language">
            <option value="ka">ქართული</option><option value="en">English</option><option value="es">Español</option>
            <option value="fr">Français</option><option value="de">Deutsch</option><option value="ru">Русский</option>
            <option value="tr">Türkçe</option><option value="ar">العربية</option><option value="hi">हिन्दी</option><option value="zh">中文</option>
          </select>
        </div>
      </header>
      <main>
        <section class="maintenance-card" aria-labelledby="maintenance-title">
          <div class="service-icon" aria-hidden="true">
            <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="9" width="32" height="23" rx="4"/><path d="M17 40h14m-7-8v8M8 26h32m-22-9h4m4 0h4"/><circle cx="36" cy="35" r="8" fill="#212027"/><path d="m33 35 2 2 4-4"/></svg>
          </div>
          <div class="status-label"><span aria-hidden="true"></span><span data-copy="status">დაგეგმილი ტექნიკური სამუშაოები</span></div>
          <h1 id="maintenance-title" data-copy="title">პლატფორმა დროებით მიუწვდომელია</h1>
          <p class="description" data-copy="description">პლატფორმაზე მიმდინარეობს დაგეგმილი ტექნიკური სამუშაოები სერვისის განახლებისა და სტაბილურობის გაუმჯობესებისთვის.</p>
          <div class="resume-card">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4m10-4v4M3 11h18m-14 4h3m4 0h3"/></svg>
            <div><p data-copy="resumeLabel">პლატფორმა მუშაობას განაახლებს</p><time datetime="2026-10-31T14:00:00Z" data-copy="date">31 ოქტომბერს, 18:00-ზე</time></div>
          </div>
          <p class="thanks" data-copy="thanks">გმადლობთ მოთმინებისა და გაგებისთვის.</p>
        </section>
      </main>
      <footer>© 2026 TaskMall</footer>
    </div>
  </body>
</html>
